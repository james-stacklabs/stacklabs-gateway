<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StackLabs // Scheduled Maintenance</title>
  <meta name="description" content="StackLabs Enterprise Edge Systems — Scheduled Maintenance in Progress." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070A;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Subtle ambient lighting */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, rgba(0, 212, 255, 0) 70%);
      pointer-events: none;
      z-index: 1;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo-wrapper {
      width: 280px;
      height: 280px;
      position: relative;
      margin-bottom: 2rem;
    }
    @media (min-width: 640px) {
      .logo-wrapper {
        width: 340px;
        height: 340px;
      }
    }
    svg {
      width: 100%;
      height: 100%;
      contain: strict;
      shape-rendering: geometricPrecision;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.25);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38BDF8;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #00E5FF;
      box-shadow: 0 0 8px #00E5FF;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .footer {
      position: absolute;
      bottom: 2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #475569;
      letter-spacing: 0.08em;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="ambient-glow"></div>

  <main class="container">
    <div class="logo-wrapper">
      <svg id="logo-svg" viewBox="-120 -120 240 240">
        <defs>
          <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g id="edges-group"></g>
      </svg>
    </div>

    <h1 class="title">STACKLABS</h1>
    <div class="badge">
      <span class="badge-dot"></span>
      <span>UNDER SCHEDULED MAINTENANCE</span>
    </div>
  </main>

  <footer class="footer">
    <span>SYSTEM DISPATCH: SECURE EDGE ENCLAVE</span>
  </footer>

  <script>
    // 3D Wireframe S/SL Interlocking Monogram Engine
    const boxesLoop1 = [
      { xMin: -14, xMax: -10, yMin: 12,  yMax: 16,  zMin: -16, zMax: 0 },
      { xMin: -12, xMax: 12,  yMin: 12,  yMax: 16,  zMin: -18, zMax: -14 },
      { xMin: 10,  xMax: 14,  yMin: 0,   yMax: 14,  zMin: -18, zMax: -14 },
      { xMin: 10,  xMax: 14,  yMin: -2,  yMax: 2,   zMin: -16, zMax: 16 },
      { xMin: 10,  xMax: 14,  yMin: -14, yMax: 0,   zMin: 14,  zMax: 18 },
      { xMin: -12, xMax: 12,  yMin: -16, yMax: -12, zMin: 14,  zMax: 18 }
    ];

    const boxesLoop2 = boxesLoop1.map(b => ({
      xMin: -b.xMax,
      xMax: -b.xMin,
      yMin: -b.yMax,
      yMax: -b.yMin,
      zMin: -b.zMax,
      zMax: -b.zMin
    }));

    const allBoxes = [...boxesLoop1, ...boxesLoop2];
    const meshVertices = [];
    const meshEdges = [];

    allBoxes.forEach((box, index) => {
      const startIndex = index * 8;
      meshVertices.push(
        { x: box.xMin, y: box.yMin, z: box.zMin }, // 0
        { x: box.xMax, y: box.yMin, z: box.zMin }, // 1
        { x: box.xMin, y: box.yMax, z: box.zMin }, // 2
        { x: box.xMax, y: box.yMax, z: box.zMin }, // 3
        { x: box.xMin, y: box.yMin, z: box.zMax }, // 4
        { x: box.xMax, y: box.yMin, z: box.zMax }, // 5
        { x: box.xMin, y: box.yMax, z: box.zMax }, // 6
        { x: box.xMax, y: box.yMax, z: box.zMax }  // 7
      );

      meshEdges.push(
        { u: startIndex + 0, v: startIndex + 1 },
        { u: startIndex + 2, v: startIndex + 3 },
        { u: startIndex + 4, v: startIndex + 5 },
        { u: startIndex + 6, v: startIndex + 7 },
        { u: startIndex + 0, v: startIndex + 2 },
        { u: startIndex + 1, v: startIndex + 3 },
        { u: startIndex + 4, v: startIndex + 6 },
        { u: startIndex + 5, v: startIndex + 7 },
        { u: startIndex + 0, v: startIndex + 4 },
        { u: startIndex + 1, v: startIndex + 5 },
        { u: startIndex + 2, v: startIndex + 6 },
        { u: startIndex + 3, v: startIndex + 7 }
      );
    });

    const edgesGroup = document.getElementById('edges-group');
    let theta = 0;
    const D = 120;
    const scale = 3.8;
    const tiltX = 18 * Math.PI / 180;
    const cosX = Math.cos(tiltX);
    const sinX = Math.sin(tiltX);
    const zMin = -28;
    const zMax = 28;

    function renderFrame() {
      theta = (theta + 0.012) % (Math.PI * 2);
      const cosY = Math.cos(theta);
      const sinY = Math.sin(theta);

      const projectedVertices = meshVertices.map(v => {
        const x1 = v.x * cosY - v.z * sinY;
        const z1 = v.x * sinY + v.z * cosY;
        const y1 = v.y;

        const x2 = x1;
        const y2 = y1 * cosX - z1 * sinX;
        const z2 = y1 * sinX + z1 * cosX;

        const s = D / (D - z2);
        const px = x2 * s * scale;
        const py = y2 * s * scale;

        return { x: px, y: py, z: z2 };
      });

      const projectedEdges = meshEdges.map(edge => {
        const p1 = projectedVertices[edge.u];
        const p2 = projectedVertices[edge.v];
        return {
          x1: p1.x,
          y1: p1.y,
          x2: p2.x,
          y2: p2.y,
          avgZ: (p1.z + p2.z) / 2
        };
      });

      projectedEdges.sort((a, b) => a.avgZ - b.avgZ);

      let svgContent = '';
      for (let i = 0; i < projectedEdges.length; i++) {
        const edge = projectedEdges[i];
        const t = Math.max(0, Math.min(1, (edge.avgZ - zMin) / (zMax - zMin)));
        const strokeWidth = (0.6 + t * 1.5).toFixed(2);
        const opacity = (0.12 + t * 0.78).toFixed(2);
        const stroke = t > 0.52 ? '#ffffff' : '#00d4ff';
        const filterAttr = t > 0.7 ? ' filter="url(#glow-filter)"' : '';

        svgContent += `<line x1="${edge.x1.toFixed(1)}" y1="${edge.y1.toFixed(1)}" x2="${edge.x2.toFixed(1)}" y2="${edge.y2.toFixed(1)}" stroke="${stroke}" stroke-width="${strokeWidth}" opacity="${opacity}" stroke-linecap="round"${filterAttr} />`;
      }

      edgesGroup.innerHTML = svgContent;
      requestAnimationFrame(renderFrame);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Not Found | StackLabs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background: #0a0b0e;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 0.5rem 0;
      color: #10b981;
      font-family: monospace;
    }
    p {
      color: #9ca3af;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    a {
      color: #10b981;
      text-decoration: none;
      border: 1px solid #10b981;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    a:hover {
      background: #10b981;
      color: #0a0b0e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>The requested route does not exist on this edge appliance.</p>
    <a href="/">Return to StackLabs</a>
  </div>
</body>
</html>
